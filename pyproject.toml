[project]
name = "agent-system"
version = "0.1.0"
description = "Public policy, contracts, plugins, profiles, and runtime tooling for the zaurakworks Agent system"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.scripts]
cap = "agent_system.cap.cli:main"
agent-profile = "agent_system.profile.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true
