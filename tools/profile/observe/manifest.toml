# observe profile — 声明态（declared）
# 这份文件进 git。物化出来的 home 不进 git。

[profile]
name = "observe"
version = "v1"

[model]
provider = "claude"
id = "opus"

[skills]
# 白名单。物化时只把这些复制进 home，其余物理上不存在。
allow = ["stage"]
source = '<repo>\.claude\skills'

# 黑名单。CLI 内置 skill 在二进制里，白名单管不到，只能逐个关。
# 只关会产生持久物或写入的；分析类（code-review / simplify / dataviz 等）留着。
deny = ["init", "loop", "schedule", "update-config", "run"]

[mcp]
# 物化 home 里没写任何 MCP 定义，所以声明面是空。
# 上一轮运行自报看到 claude.ai / Google Drive —— 那是账号级连接器，
# 未核验 CLAUDE_CONFIG_DIR 能不能隔离它。故意先不写进不可控：
# 让它报成漂移，拿到证据再决定是关掉还是承认管不了。
# --strict-mcp-config：不给 --mcp-config 就等于一个都不加载。
# 这一条把 allow=[] 从「声明」变成「强制」。
allow = []
strict = true

[context]
# 运行时自动加载为指令的文件。物化 home 里没有 CLAUDE.md，
# 系统提示词走 --append-system-prompt-file（不算 context file），所以预期为空。
# 锚点文件随 skill 进了物化 home，agent 会报它 —— 这条是有意的。
# 用户级 CLAUDE.md 仍不声明：CLAUDE_CONFIG_DIR 不重定向它，
# 候选修法 --setting-sources 未验证，先让它继续报漂移。
allow = ['<home>\skills\stage\anchor.md']

[uncontrollable]
# 这个 profile 明确管不了的维度。每一条都要有证据 ——
# 没证据就声明不可控，等于把可修的问题登记成既成事实，比漏掉更危险。
skills = [
  # 二进制内：claude.exe 里 grep 得到字符串，且用户目录全树无同名文件
  "dataviz", "keybindings-help", "fewer-permission-prompts", "security-review",
  "simplify", "claude-api",
  # 磁盘上，但在真实 ~/.claude 里：marketplace 缓存不跟 CLAUDE_CONFIG_DIR 走
  "code-review",
]
reason = "前六个在 claude.exe 二进制内（grep 命中，用户目录无同名）；code-review 来自 ~/.claude/plugins/marketplaces/claude-plugins-official，该发现路径不受 CLAUDE_CONFIG_DIR 影响。code-review 在 4 次观测中出现 3 次，可用性不稳定。"

# 用户级 CLAUDE.md。四个变体全部未能阻止它加载：
#   A 基线 / B --setting-sources project,local / C B+--settings / D 重定向 HOME+USERPROFILE
# 结论：Claude Code 用 OS API 解析真实用户目录，不看环境变量。
# 唯一的修法是删掉这个文件 —— 而它承载着交互式会话的锚点，删了代价更大。
# 所以这里是有据的「管不了」，不是懒得管。
context = ['<userhome>\.claude\CLAUDE.md']

[plugins]
# 空 = 一个插件都不启用
enabled = []

[seed]
# 从真实 home 复制进物化 home 的东西。
# 只有凭据 —— 显式列出，让"哪些机密跨过去了"可审计。
# 这些文件永不进 git。
from = '<userhome>\.claude'
files = [".credentials.json"]

[settings]
# 直接写进物化 home 的 settings.json
skillListingBudgetFraction = 0.05
permissionsDefaultMode = "bypassPermissions"

[prompt]
# 锚点也只有一份来源：skill 树。之前 _shared/anchor.md 是逐字副本，会漂移。
anchor = '<skills>\stage\anchor.md'
# 阶段规则不进系统提示词：唯一来源是 skill，由锚点第 5 条按名加载

[run]
# 工作目录。<work> = 仓库外的专用目录，既不是仓库（否则本仓入口进上下文），
# 也不是物化 home（Codex 沙箱拒绝往自己的 CODEX_HOME 写）。
workdir = "<work>"
