name: Cross-host assembly checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # 已提交的 .cap/lock.json 必须在每个受支持宿主上原样复现。两个 job 跑同一条
  # 检查，"同一提交在两端产出相同 digest"因此由两侧门禁共同证明，而不是靠单机
  # 手工核对。现有三个 ubuntu-latest job 不受影响。
  windows-assembly:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync locked Python project
        run: uv sync --locked

      # 这两组用例分别断言"权限位不进 digest"与"目录校验两端同构"，
      # 因此在两个宿主上断言同一组结论。
      - name: Test host-independent digests and portable directory checks
        run: >-
          uv run python -m unittest
          tests.profile.test_profile.CanonicalModeTests
          tests.profile.test_profile.PortableDirectoryTests -v

      # --fresh 的一次性根必须落在真实 home 之下，并且能表达为 client 需要的
      # home 相对名。这一组在每个宿主上真实构造并销毁该根，因此「一次性根两端
      # 可用」由门禁产生，而不是靠单机手工执行记录。
      - name: Test one-shot runtime root is usable on this host
        run: >-
          uv run python -m unittest
          tests.profile.test_profile.EphemeralRuntimeRootTests -v

      - name: Lock reproduces the committed digest
        run: uv run cap lock

      - name: Committed lock is unchanged
        run: git diff --exit-code .cap/lock.json

      - name: Show declared closure for general
        run: uv run cap show general

      - name: Show declared closure for agent-assembler
        run: uv run cap show agent-assembler

      # render smoke：目录校验在 Windows 上真的走通，而不是只有声明态通过。
      - name: Lock machine context
        run: uv run cap machine-context-lock

      - name: Approve machine context
        run: uv run cap machine-context-approve

      - name: Bind agent-assembler
        run: uv run cap assembly-bind agent-assembler

      - name: Prepare render output directory
        run: New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/cap-render" | Out-Null

      - name: Render agent-assembler for omp
        run: uv run cap render agent-assembler --cli omp --output "$env:RUNNER_TEMP/cap-render"

      - name: Rendered tree is not empty
        run: |
          $files = Get-ChildItem -Recurse -File "$env:RUNNER_TEMP/cap-render"
          if ($files.Count -lt 1) { throw "render produced no files" }
          Write-Output "rendered $($files.Count) files"

  posix-assembly:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync locked Python project
        run: uv sync --locked

      - name: Test host-independent digests and portable directory checks
        run: >-
          uv run python -m unittest
          tests.profile.test_profile.CanonicalModeTests
          tests.profile.test_profile.PortableDirectoryTests -v

      # --fresh 的一次性根必须落在真实 home 之下，并且能表达为 client 需要的
      # home 相对名。这一组在每个宿主上真实构造并销毁该根，因此「一次性根两端
      # 可用」由门禁产生，而不是靠单机手工执行记录。
      - name: Test one-shot runtime root is usable on this host
        run: >-
          uv run python -m unittest
          tests.profile.test_profile.EphemeralRuntimeRootTests -v

      - name: Lock reproduces the committed digest
        run: uv run cap lock

      - name: Committed lock is unchanged
        run: git diff --exit-code .cap/lock.json

  # macOS 是 #109 认定的第二个受支持宿主，也是唯一同时具备「临时目录不在 home
  # 之下」与「原生 render 可用」的宿主：Windows 的临时目录在 home 之下，因此
  # 无法在那里断言「home 之外不可命名」。没有这个 job，macOS 侧的结论只能记为
  # not-verified。
  macos-assembly:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync locked Python project
        run: uv sync --locked

      - name: Test host-independent digests and portable directory checks
        run: >-
          uv run python -m unittest
          tests.profile.test_profile.CanonicalModeTests
          tests.profile.test_profile.PortableDirectoryTests -v

      - name: Test one-shot runtime root is usable on this host
        run: >-
          uv run python -m unittest
          tests.profile.test_profile.EphemeralRuntimeRootTests -v

      - name: Lock reproduces the committed digest
        run: uv run cap lock

      - name: Committed lock is unchanged
        run: git diff --exit-code .cap/lock.json

      - name: Show declared closure for general
        run: uv run cap show general

      - name: Show declared closure for agent-assembler
        run: uv run cap show agent-assembler

      - name: Lock machine context
        run: uv run cap machine-context-lock

      - name: Approve machine context
        run: uv run cap machine-context-approve

      - name: Bind agent-assembler
        run: uv run cap assembly-bind agent-assembler

      - name: Bind general
        run: uv run cap assembly-bind general

      - name: Prepare render output directories
        run: mkdir -p "$RUNNER_TEMP/cap-render-omp" "$RUNNER_TEMP/cap-render-claude"

      - name: Render agent-assembler for omp
        run: >-
          uv run cap render agent-assembler --cli omp
          --output "$RUNNER_TEMP/cap-render-omp"

      # Claude adapter 的 macOS 侧此前完全未验证。portable render 不需要安装
      # claude，因此这一步可以把 macOS 从 not-verified 提升为门禁覆盖。
      - name: Render general for claude
        run: >-
          uv run cap render general --cli claude
          --output "$RUNNER_TEMP/cap-render-claude"

      - name: Rendered trees are not empty
        run: |
          for dir in "$RUNNER_TEMP/cap-render-omp" "$RUNNER_TEMP/cap-render-claude"; do
            count=$(find "$dir" -type f | wc -l | tr -d ' ')
            if [ "$count" -lt 1 ]; then
              echo "render produced no files: $dir" >&2
              exit 1
            fi
            echo "rendered $count files: $dir"
          done
